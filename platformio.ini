; PlatformIO project for the ESP32-C3 Supermini desktop companion
; Board: ESP32-C3 Supermini (generic dev board, native USB, no PSRAM)
; Display: ST7789 240x240 SPI
; Touch: TTP223 capacitive touch module (digital output)

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; The Supermini has no USB-UART bridge chip: it uses the ESP32-C3's native
; USB peripheral as a CDC serial port. These two flags are required for
; Serial (used for both the console and the PC-link protocol) to work.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    bblanchon/ArduinoJson@^7.0.4
